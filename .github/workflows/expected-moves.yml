name: Update expected moves

on:
  schedule:
    # GitHub cron is in UTC: every 30 min from 13:00–21:30 UTC on weekdays
    # (≈ 8:00am–4:30pm ET in winter, 9:00am–5:30pm ET in summer).
    # GitHub can start scheduled runs a few minutes late.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: expected-moves
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compute expected moves
        run: python scripts/fetch_expected_moves.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expected-moves.json data/expected-moves.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update expected moves"
            git pull --rebase --autostash
            git push
          fi
