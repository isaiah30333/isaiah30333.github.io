name: Update expected moves

on:
  schedule:
    # GitHub cron is in UTC: twice an hour from 13:00–21:59 UTC on weekdays
    # (≈ 8am–5pm ET in winter, 9am–6pm ET in summer). Odd minutes (:07/:37) on purpose:
    # GitHub delays or drops scheduled runs at busy times like :00 and :30.
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch: {}        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: expected-moves
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compute expected moves
        run: python scripts/fetch_expected_moves.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expected-moves.json data/expected-moves.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update expected moves"
            git pull --rebase --autostash
            git push
          fi
