<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isaiah Cordova · Finance &amp; Investment Analysis</title>
  <meta name="description" content="Isaiah Cordova · CSU Finance">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css?v=20261119m">
  <link rel="stylesheet" href="assets/css/pages.css?v=20261119m">
  <link rel="stylesheet" href="assets/css/drawer.css?v=20261119m">
  <script src="assets/js/config.js?v=20261119m"></script>
  <script src="assets/js/site.js?v=20261119m"></script>
  <!-- the words on this page live in content.js -->
  <script src="assets/js/content.js?v=20261119m"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <!-- HERO (text comes from content.js; name and tagline from config.js) -->
    <section class="hero container">
      <p class="eyebrow reveal"><span data-site="tagline"></span></p>
      <h1 class="reveal" style="--d:.05s"><span data-site="name"></span></h1>
      <p class="lead reveal" style="--d:.1s" id="hero-lead"></p>
      <div class="cta-row reveal" style="--d:.15s">
        <a class="btn" data-site-href="linkedin" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>
          LinkedIn
        </a>
        <a class="btn btn-ghost" data-gmail-compose href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Email me
        </a>
      </div>
    </section>

    <!-- everything below the hero rides up over the photo on one rounded sheet -->
    <div class="sheet">
      <section class="container">
        <div class="facts reveal" id="facts"></div>
      </section>

      <section class="section" id="about">
        <div class="container">
          <div class="section-head reveal" id="about-head"></div>
          <div class="about-grid" id="about-grid"></div>
        </div>
      </section>

      <section class="section" id="work">
        <div class="container">
          <div class="section-head reveal" id="work-head"></div>
          <div class="grid grid-2" id="work-grid"></div>
        </div>
      </section>

      <section class="section" id="contact">
        <div class="container">
          <div class="contact-card reveal">
            <div id="contact-head"></div>
            <div class="contact-links">
              <a class="contact-row" data-gmail-compose href="#" target="_blank" rel="noopener">
                <span class="contact-k">Email</span>
                <span class="contact-v" data-site="email"></span>
                <span aria-hidden="true">↗</span>
              </a>
              <a class="contact-row" data-site-href="linkedin" href="#" target="_blank" rel="noopener">
                <span class="contact-k">LinkedIn</span>
                <span class="contact-v">View profile</span>
                <span aria-hidden="true">↗</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/home.js?v=20261119m"></script>
</body>
</html>
